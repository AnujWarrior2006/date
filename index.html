<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Will you go on a date with me? ❤️</title>

<style>
  :root{
    --blush:#FFE3EC; --lavender:#E9E1FF; --cream:#FFF8FB;
    --rose:#FF5C8A; --rose-deep:#E11D74; --rose-light:#FFB3C7;
    --ink:#3B2440; --gold:#FFD166;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; min-height:100vh; overflow-x:hidden;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    color:var(--ink);
    background:linear-gradient(135deg,#ffe3ec,#fff8fb,#e9e1ff,#fff0f5);
    background-size:300% 300%;
    animation:gradientShift 18s ease infinite;
    display:flex; align-items:center; justify-content:center;
    padding:24px;
    position:relative;
  }
  @keyframes gradientShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
  .display{font-family:Georgia,'Times New Roman',serif; font-style:italic;}
  .gradient-text{
    background:linear-gradient(90deg,var(--rose),var(--rose-deep));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  /* ambient bg */
  #bg{position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:0;}
  .blob{position:absolute; border-radius:50%; filter:blur(60px); animation:floatSlow 9s ease-in-out infinite;}
  @keyframes floatSlow{0%,100%{transform:translateY(0)}50%{transform:translateY(-30px)}}
  .float-item{position:absolute; bottom:-10%; opacity:0; animation:floatUp linear infinite;}
  @keyframes floatUp{
    0%{transform:translateY(0); opacity:0;}
    10%{opacity:1;} 90%{opacity:1;}
    100%{transform:translateY(-120vh); opacity:0;}
  }
  #cursor-hearts{position:fixed; inset:0; z-index:60; pointer-events:none;}
  .cursor-heart{position:absolute; color:var(--rose); font-size:14px; transform:translate(-50%,-50%);
    animation:cursorHeart .7s ease-out forwards;}
  @keyframes cursorHeart{from{opacity:.9; transform:translate(-50%,-50%) scale(.6);} to{opacity:0; transform:translate(-50%,-150%) scale(1.1);}}

  .controls{position:fixed; top:16px; right:16px; z-index:50; display:flex; gap:8px;}
  .ctrl-btn{width:40px; height:40px; border-radius:50%; border:none; cursor:pointer;
    background:rgba(255,255,255,.6); backdrop-filter:blur(12px); box-shadow:0 8px 32px rgba(225,29,116,.12);
    display:flex; align-items:center; justify-content:center; font-size:16px;}
  body.dark .ctrl-btn{background:rgba(255,255,255,.08); color:#fff;}

  .card{
    background:rgba(255,255,255,.6); backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.7); border-radius:28px;
    box-shadow:0 20px 60px rgba(225,29,116,.18);
    padding:48px 40px; max-width:480px; width:100%;
    text-align:center; position:relative; z-index:10;
    animation:cardIn .5s ease-out;
  }
  body.dark .card{background:rgba(255,255,255,.06); border-color:rgba(255,255,255,.1);}
  @keyframes cardIn{from{opacity:0; transform:scale(.92)} to{opacity:1; transform:scale(1)}}
  .step{display:none;}
  .step.active{display:block;}

  h1,h2{margin:0;}
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    border-radius:999px; font-weight:700; cursor:pointer; border:none;
    padding:14px 34px; font-size:16px; transition:transform .15s ease, box-shadow .15s ease;
    background:linear-gradient(90deg,var(--rose),var(--rose-deep)); color:#fff;
    box-shadow:0 8px 32px rgba(225,29,116,.12);
  }
  .btn:hover{transform:scale(1.04);}
  .btn:disabled{opacity:.4; cursor:not-allowed; transform:none;}
  .btn-outline{
    background:rgba(255,255,255,.5); color:rgba(59,36,64,.7); border:2px solid rgba(59,36,64,.2);
  }
  body.dark .btn-outline{background:rgba(255,255,255,.05); color:rgba(255,255,255,.7); border-color:rgba(255,255,255,.2);}

  #noBtn{white-space:nowrap; transition:transform .3s ease;}

  .typewriter{font-size:19px; font-weight:600; color:rgba(59,36,64,.7); min-height:28px;}
  body.dark .typewriter{color:rgba(255,255,255,.7);}
  .cursor-blink{display:inline-block; width:2px; height:1em; background:rgba(59,36,64,.5); vertical-align:middle; margin-left:2px; animation:blink 1s step-end infinite;}
  @keyframes blink{50%{opacity:0}}

  .activity-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin:24px 0;}
  @media (max-width:420px){.activity-grid{grid-template-columns:repeat(2,1fr);}}
  .activity-card{
    background:rgba(255,255,255,.5); border:2px solid rgba(255,255,255,.6); border-radius:18px;
    padding:18px 8px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:6px;
    transition:transform .15s ease, border-color .15s ease;
  }
  body.dark .activity-card{background:rgba(255,255,255,.05); border-color:rgba(255,255,255,.1);}
  .activity-card:hover{transform:scale(1.05); border-color:var(--rose-light);}
  .activity-card.selected{border-color:var(--rose); box-shadow:0 0 0 4px rgba(255,92,138,.25), 0 8px 30px rgba(225,29,116,.35);}
  .activity-card .emoji{font-size:28px;}
  .activity-card .label{font-size:13px; font-weight:600;}

  .cal-header{display:flex; align-items:center; justify-content:space-between; margin:16px 0;}
  .cal-header button{width:34px; height:34px; border-radius:50%; border:none; background:rgba(255,255,255,.5); cursor:pointer; font-size:16px;}
  body.dark .cal-header button{background:rgba(255,255,255,.08); color:#fff;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:16px;}
  .cal-weekday{font-size:11px; font-weight:700; color:rgba(59,36,64,.4); text-align:center;}
  body.dark .cal-weekday{color:rgba(255,255,255,.4);}
  .cal-day{aspect-ratio:1; border:none; border-radius:12px; background:transparent; cursor:pointer; font-size:14px; font-weight:500; color:rgba(59,36,64,.8);}
  body.dark .cal-day{color:rgba(255,255,255,.8);}
  .cal-day:hover:not(:disabled):not(.selected){background:rgba(255,255,255,.6);}
  .cal-day.other-month{opacity:.25;}
  .cal-day:disabled{opacity:.2; cursor:not-allowed;}
  .cal-day.selected{background:linear-gradient(90deg,var(--rose),var(--rose-deep)); color:#fff; transform:scale(1.05);}

  .time-grid{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin:24px 0;}
  .time-pill{
    padding:11px 22px; border-radius:999px; font-weight:700; font-size:14px; cursor:pointer;
    background:rgba(255,255,255,.5); border:2px solid rgba(255,255,255,.6); color:rgba(59,36,64,.7);
  }
  body.dark .time-pill{background:rgba(255,255,255,.05); border-color:rgba(255,255,255,.1); color:rgba(255,255,255,.7);}
  .time-pill.selected{background:linear-gradient(90deg,var(--rose),var(--rose-deep)); color:#fff; border-color:transparent;
    box-shadow:0 0 0 4px rgba(255,92,138,.25), 0 8px 24px rgba(225,29,116,.35);}

  .summary-row{display:flex; justify-content:space-between; font-size:14px; padding:4px 0;}
  .summary-label{color:rgba(59,36,64,.5);} body.dark .summary-label{color:rgba(255,255,255,.5);}
  .summary-value{font-weight:700;}
  .summary-box{background:rgba(255,255,255,.5); border-radius:16px; padding:18px; margin:20px 0; text-align:left;}
  body.dark .summary-box{background:rgba(255,255,255,.05);}

  .countdown{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:16px 0;}
  .countdown div{background:rgba(255,255,255,.6); border-radius:12px; padding:10px 0;}
  body.dark .countdown div{background:rgba(255,255,255,.1);}
  .countdown .num{font-family:Georgia,serif; font-size:22px; color:var(--rose-deep); display:block;}
  .countdown .lbl{font-size:9px; text-transform:uppercase; letter-spacing:.05em; color:rgba(59,36,64,.4);}

  .modal-overlay{position:fixed; inset:0; background:rgba(59,36,64,.4); backdrop-filter:blur(4px); z-index:80; display:flex; align-items:center; justify-content:center; padding:24px;}
  .confetti-piece{position:fixed; top:-20px; z-index:70; pointer-events:none; border-radius:2px;}
  @keyframes confettiFall{to{transform:translateY(110vh) rotate(720deg); opacity:0;}}
  .flash{position:fixed; inset:0; background:#fff; z-index:65; pointer-events:none; animation:flashFade .9s ease forwards;}
  @keyframes flashFade{0%{opacity:0}15%{opacity:.85}100%{opacity:0}}
  .bounce-emoji{font-size:64px; animation:bounce 2.4s ease-in-out infinite;}
  @keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
</style>
</head>

<script>
/* ---------- Ambient background ---------- */
const bg = document.getElementById('bg');
const blobColors = ['rgba(255,179,199,.4)','rgba(233,225,255,.6)','rgba(255,209,102,.2)'];
const blobPos = [
  {top:'-8rem',left:'-6rem',size:'22rem'},
  {top:'40%',right:'-8rem',size:'26rem'},
  {bottom:'-6rem',left:'25%',size:'20rem'}
];
blobPos.forEach((p,i)=>{
  const b=document.createElement('div');
  b.className='blob';
  Object.assign(b.style,{width:p.size,height:p.size,background:blobColors[i],
    top:p.top||'', left:p.left||'', right:p.right||'', bottom:p.bottom||'',
    animationDelay:(i*2)+'s'});
  bg.appendChild(b);
});
for(let i=0;i<18;i++){
  const el=document.createElement('span');
  el.className='float-item';
  const isHeart = Math.random()>0.6 ? false : true;
  el.textContent = isHeart ? '❤' : '✦';
  el.style.left = (Math.random()*100)+'%';
  el.style.fontSize = (12+Math.random()*22)+'px';
  el.style.color = isHeart ? 'rgba(255,92,138,.4)' : 'rgba(255,209,102,.7)';
  el.style.animationDuration = (10+Math.random()*10)+'s';
  el.style.animationDelay = (Math.random()*8)+'s';
  bg.appendChild(el);
}

/* ---------- Cursor hearts ---------- */
const cursorLayer = document.getElementById('cursor-hearts');
let lastSpawn = 0;
const coarsePointer = window.matchMedia('(pointer: coarse)').matches;
const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if(!coarsePointer && !reducedMotion){
  window.addEventListener('mousemove', (e)=>{
    const now = Date.now();
    if(now - lastSpawn < 90) return;
    lastSpawn = now;
    const h = document.createElement('span');
    h.className='cursor-heart';
    h.textContent='❤';
    h.style.left=e.clientX+'px';
    h.style.top=e.clientY+'px';
    cursorLayer.appendChild(h);
    setTimeout(()=>h.remove(), 700);
  });
}

/* ---------- Sound (Web Audio, synthesized) ---------- */
let soundEnabled = false;
let audioCtx = null;
function getCtx(){ if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); return audioCtx; }
function playSound(kind){
  if(!soundEnabled) return;
  const ctx = getCtx();
  const now = ctx.currentTime;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain); gain.connect(ctx.destination);
  if(kind==='tap'){
    osc.type='sine'; osc.frequency.setValueAtTime(520, now);
    gain.gain.setValueAtTime(.06, now); gain.gain.exponentialRampToValueAtTime(.001, now+.12);
    osc.start(now); osc.stop(now+.12);
  } else if(kind==='whoosh'){
    osc.type='sine'; osc.frequency.setValueAtTime(300, now); osc.frequency.exponentialRampToValueAtTime(120, now+.18);
    gain.gain.setValueAtTime(.05, now); gain.gain.exponentialRampToValueAtTime(.001, now+.2);
    osc.start(now); osc.stop(now+.2);
  } else {
    osc.type='triangle';
    [660,880,1100].forEach((f,i)=>osc.frequency.setValueAtTime(f, now+i*.1));
    gain.gain.setValueAtTime(.07, now); gain.gain.exponentialRampToValueAtTime(.001, now+.4);
    osc.start(now); osc.stop(now+.4);
  }
}
document.getElementById('soundBtn').addEventListener('click', function(){
  soundEnabled = !soundEnabled;
  this.textContent = soundEnabled ? '🔊' : '🔇';
});
document.getElementById('themeBtn').addEventListener('click', function(){
  document.body.classList.toggle('dark');
  this.textContent = document.body.classList.contains('dark') ? '☀️' : '🌙';
});

/* ---------- Step navigation ---------- */
function goToStep(id){
  document.querySelectorAll('.step').forEach(s=>s.classList.remove('active'));
  document.getElementById('step-'+id).classList.add('active');
}

/* ---------- Step 1: Intro typewriter ---------- */
const twText = "I have something important to ask you...";
const twEl = document.getElementById('typewriter');
const introBtn = document.getElementById('introContinue');
(function typewrite(){
  if(reducedMotion){
    twEl.textContent = twText;
    introBtn.style.opacity=1; introBtn.style.pointerEvents='auto';
    return;
  }
  let i=0;
  const cursor = document.createElement('span');
  cursor.className='cursor-blink';
  function step(){
    i++;
    twEl.textContent = twText.slice(0,i);
    twEl.appendChild(cursor);
    if(i<twText.length){ setTimeout(step, 45); }
    else { introBtn.style.opacity=1; introBtn.style.pointerEvents='auto'; }
  }
  step();
})();
introBtn.addEventListener('click', ()=> goToStep('question'));

/* ---------- Step 2: Question ---------- */
const NO_TEXTS = ["No","Are you sure?","Really?","Think again 🥺","Please?","I'll buy dessert 🍰","I'll bring flowers 🌹","Pretty please ❤️","Last chance 😭","Don't break my heart 💔"];
const yesBtn = document.getElementById('yesBtn');
const noBtn = document.getElementById('noBtn');
let clicks = 0;
let noHasMoved = false;

function updateNoLabel(){
  noBtn.textContent = NO_TEXTS[Math.min(clicks, NO_TEXTS.length-1)];
}

function dodgeNoButton(){
  const rot = -20 + Math.random()*40;
  const scale = Math.max(0.35, 1 - clicks*0.12);
  noBtn.style.transform = `rotate(${rot}deg) scale(${scale})`;
}

noBtn.addEventListener('click', ()=>{
  playSound('tap');
  clicks++;
  updateNoLabel();
  dodgeNoButton();
  const yesScale = Math.min(3.2, 1 + clicks*0.18);
  yesBtn.style.transform = `scale(${yesScale})`;
  if(clicks >= 10){
    playSound('whoosh');
    showEasterEgg();
  }
});

function showEasterEgg(){
  const overlay = document.createElement('div');
  overlay.className='modal-overlay';
  overlay.innerHTML = `
    <div class="card" style="max-width:340px; padding:36px 28px;">
      <p class="display" style="font-size:24px; margin-bottom:6px;">Nice try 😄</p>
      <p style="color:rgba(59,36,64,.6); margin-bottom:20px;">I think you know what to do now.</p>
      <button class="btn" id="closeEgg">Okay, okay 😅</button>
    </div>`;
  document.body.appendChild(overlay);
  for(let i=0;i<50;i++){
    const s = document.createElement('span');
    s.textContent='❤️';
    s.style.position='fixed';
    s.style.left = (Math.random()*100)+'vw';
    s.style.top = (Math.random()*100)+'vh';
    s.style.fontSize='24px';
    s.style.opacity='0.9';
    s.style.zIndex='79';
    s.style.pointerEvents='none';
    overlay.appendChild(s);
  }
  overlay.querySelector('#closeEgg').addEventListener('click', ()=>{
    overlay.remove();
    yesBtn.focus();
  });
}

function launchConfetti(count){
  const colors=['#FF5C8A','#E11D74','#FFD166','#E9E1FF','#ffffff'];
  for(let i=0;i<count;i++){
    const p = document.createElement('div');
    p.className='confetti-piece';
    const size = 6+Math.random()*8;
    p.style.width=size+'px'; p.style.height=(size*0.4)+'px';
    p.style.left=(Math.random()*100)+'vw';
    p.style.background = colors[Math.floor(Math.random()*colors.length)];
    p.style.animation = `confettiFall ${2+Math.random()*1.5}s ease-in forwards`;
    p.style.animationDelay = (Math.random()*0.4)+'s';
    document.body.appendChild(p);
    setTimeout(()=>p.remove(), 4000);
  }
}

yesBtn.addEventListener('click', ()=>{
  playSound('success');
  const flash = document.createElement('div');
  flash.className='flash';
  document.body.appendChild(flash);
  setTimeout(()=>flash.remove(), 900);
  launchConfetti(120);
  document.getElementById('questionEmoji').style.transform='scale(1.15) rotate(-4deg)';
  setTimeout(()=>{ goToStep('activity'); }, 1400);
});

/* ---------- Step 3: Activities ---------- */
const ACTIVITIES = [
  {id:'coffee',label:'Coffee',emoji:'☕'},{id:'movie',label:'Movie',emoji:'🎬'},
  {id:'pottery',label:'Pottery',emoji:'🏺'},{id:'amusement',label:'Amusement Park',emoji:'🎢'},
  {id:'thrift',label:'Thrift Shopping',emoji:'🛍️'},{id:'walk',label:'Evening Walk',emoji:'🌇'},
  {id:'arcade',label:'Gaming Arcade',emoji:'🕹️'},{id:'bike',label:'Bike Ride',emoji:'🚴'}
];
let selectedActivity = null;
const activityGrid = document.getElementById('activityGrid');
ACTIVITIES.forEach(a=>{
  const el = document.createElement('div');
  el.className='activity-card';
  el.innerHTML = `<span class="emoji">${a.emoji}</span><span class="label">${a.label}</span>`;
  el.addEventListener('click', ()=>{
    selectedActivity = a;
    document.querySelectorAll('.activity-card').forEach(c=>c.classList.remove('selected'));
    el.classList.add('selected');

  });

});
document.getElementById('activityContinue').addEventListener('click', ()=> goToStep('date'));

/* ---------- Step 4: Calendar ---------- */
let visibleMonth = new Date(); visibleMonth.setDate(1);
let selectedDate = null;
const WEEKDAYS=['S','M','T','W','T','F','S'];
document.getElementById('weekdayRow').innerHTML = WEEKDAYS.map(d=>`<div class="cal-weekday">${d}</div>`).join('');

function renderCalendar(){
  const monthLabel = document.getElementById('monthLabel');
  monthLabel.textContent = visibleMonth.toLocaleDateString('en-US',{month:'long',year:'numeric'});
  const calGrid = document.getElementById('calGrid');
  calGrid.innerHTML='';
  const year = visibleMonth.getFullYear(), month = visibleMonth.getMonth();
  const firstOfMonth = new Date(year, month, 1);
  const startDay = new Date(firstOfMonth);
  startDay.setDate(startDay.getDate() - startDay.getDay());
  const today = new Date(); today.setHours(0,0,0,0);

  for(let i=0;i<42;i++){
    const d = new Date(startDay);
    d.setDate(startDay.getDate()+i);
    const btn = document.createElement('button');
    btn.className='cal-day';
    btn.textContent = d.getDate();
    if(d.getMonth() !== month) btn.classList.add('other-month');
    if(d < today) btn.disabled = true;
    if(selectedDate && d.toDateString() === selectedDate.toDateString()) btn.classList.add('selected');
    btn.addEventListener('click', ()=>{
      selectedDate = d;
      document.getElementById('dateContinue').disabled = false;
      renderCalendar();
    });
    calGrid.appendChild(btn);
  }
}
document.getElementById('prevMonth').addEventListener('click', ()=>{
  visibleMonth.setMonth(visibleMonth.getMonth()-1); renderCalendar();
});
document.getElementById('nextMonth').addEventListener('click', ()=>{
  visibleMonth.setMonth(visibleMonth.getMonth()+1); renderCalendar();
});
renderCalendar();
document.getElementById('dateContinue').addEventListener('click', ()=> goToStep('time'));

/* ---------- Step 5: Time ---------- */
const TIMES = ['2 PM','3 PM','4 PM','5 PM','6 PM','7 PM','8 PM','9 PM'];
let selectedTime = null;
const timeGrid = document.getElementById('timeGrid');
TIMES.forEach(t=>{

  el.textContent = t;

document.getElementById('timeContinue').addEventListener('click', ()=>{

});

/* ---------- Step 6: Final ---------- */
let countdownTimer = null;
function parseHour(label){
  const m = label.match(/(\d+)\s*(AM|PM)/i);
  let h = parseInt(m[1],10);
  if(m[2].toUpperCase()==='PM' && h!==12) h+=12;
  if(m[2].toUpperCase()==='AM' && h===12) h=0;
  return h;
}
function showFinal(){
  document.getElementById('sumActivity').textContent = selectedActivity ? `${selectedActivity.emoji} ${selectedActivity.label}` : '—';
  document.getElementById('sumDate').textContent = selectedDate ? selectedDate.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'}) : '—';
  document.getElementById('sumTime').textContent = selectedTime || '—';

  const target = new Date(selectedDate);
  target.setHours(parseHour(selectedTime),0,0,0);

  if(countdownTimer) clearInterval(countdownTimer);
  const countdownEl = document.getElementById('countdown');
  function tick(){
    const diff = target.getTime() - Date.now();
    if(diff <= 0){ countdownEl.innerHTML=''; clearInterval(countdownTimer); return; }
    const days = Math.floor(diff/86400000);
    const hours = Math.floor((diff/3600000)%24);
    const mins = Math.floor((diff/60000)%60);
    const secs = Math.floor((diff/1000)%60);
    countdownEl.innerHTML = [
      [days,'days'],[hours,'hrs'],[mins,'min'],[secs,'sec']
    ].map(([v,l])=>`<div><span class="num">${String(v).padStart(2,'0')}</span><span class="lbl">${l}</span></div>`).join('');
  }
  tick();
  countdownTimer = setInterval(tick, 1000);
}

console.log('[BUILD] email-only-share-v2 loaded — no navigator.share used');

(function(){
  if (window.emailjs) {
    emailjs.init({ publicKey: 'j83tTUD49OQb9YxBw' });

    console.error('[EmailJS] SDK failed to load — check network/CDN access.');
  }

function sendDateEmail(text){
  if(!window.emailjs){ return Promise.reject(new Error('EmailJS not loaded')); }
  const templateParams = {
    message: text,
    activity: selectedActivity ? `${selectedActivity.emoji} ${selectedActivity.label}` : '—',
    date: selectedDate ? selectedDate.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'}) : '—',
    time: selectedTime || '—'
  };
  return emailjs.send('service_gr2a2e3', 'template_4i2nr88', templateParams);
}

const shareBtnEl = document.getElementById('shareBtn');
// Clone-and-replace to guarantee no stale/duplicate listeners from any earlier code are attached.
const freshShareBtn = shareBtnEl.cloneNode(true);
shareBtnEl.parentNode.replaceChild(freshShareBtn, shareBtnEl);

freshShareBtn.addEventListener('click', async (e)=>{
  e.preventDefault();
  console.log('[Share] button clicked — sending email only, no native share sheet.');
  const text = `It's a date! ${selectedActivity?selectedActivity.emoji+' '+selectedActivity.label:''} on ${selectedDate?selectedDate.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}):''} at ${selectedTime}. I can't wait! ❤️`;
  const msgEl = document.getElementById('shareMsg');

  freshShareBtn.disabled = true;
  msgEl.textContent = 'Sending…';

  try{
    await sendDateEmail(text);
    msgEl.textContent = 'Sent! ❤️';
  } catch(err){
    console.error('EmailJS send failed:', err);
    msgEl.textContent = 'Could not send. Try again?';
  } finally{
    freshShareBtn.disabled = false;
    setTimeout(()=>msgEl.textContent='', 3000);
  }
});
document.getElementById('restartBtn').addEventListener('click', ()=>{
  clicks = 0; selectedActivity=null; selectedDate=null; selectedTime=null;
  yesBtn.style.transform='scale(1)';
  noBtn.style.transform='none';
  updateNoLabel();
  document.querySelectorAll('.activity-card').forEach(c=>c.classList.remove('selected'));
  document.getElementById('activityContinue').disabled = true;
  document.querySelectorAll('.time-pill').forEach(p=>p.classList.remove('selected'));
  document.getElementById('timeContinue').disabled = true;
  document.getElementById('dateContinue').disabled = true;
  document.getElementById('questionEmoji').style.transform='none';
  visibleMonth = new Date(); visibleMonth.setDate(1); renderCalendar();
  if(countdownTimer) clearInterval(countdownTimer);
  goToStep('intro');
});
